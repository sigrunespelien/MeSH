services:
  elasticsearch:
    hostname: elasticsearch
    mem_limit: 1g
    environment:
      - discovery.type=single-node
    expose:
      - "9200/tcp"
      - "9300/tcp"
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2-amd64
    networks:
      - mesh-network

networks:
  mesh-network:
    driver: bridge
